[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=adapter --cov-report=term-missing"

[tool.coverage.report]
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]
